// App-level Gradle config. This repo checks in only the Gradle files needed
// to pin ARCore; run `npx expo prebuild` to generate the rest of the native
// Android project before building.
apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

android {
    namespace "com.netrasense.mobile"
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.netrasense.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.0.1"

        // ARCore on the Samsung S21 FE 5G only ships 64-bit and 32-bit ARM
        // native libraries; restrict the native ABIs accordingly.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
}

dependencies {
    // ARCore SDK for Depth API support (used by later tickets).
    implementation "com.google.ar:core:1.46.0"
}
